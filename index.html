<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PumpToUnlock</title>
  <style>
    :root {
      --bg: #F8F9FB;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --accent: #9268FF;
      --border: #E5E7EB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1F2937;
        --text: #F3F4F6;
        --muted: #9CA3AF;
        --accent: #B39BFF;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .tagline { color: var(--muted); margin: 0 0 28px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .button {
      display: inline-block;
      padding: 12px 22px;
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 24px;
    }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>PumpToUnlock</h1>
    <p class="tagline">Do push-ups. Earn minutes. Unlock your apps.</p>
    <div class="links">
      <a class="button" href="privacy-policy/">Privacy Policy</a>
      <a class="button" href="contact/">Contact &amp; Support</a>
    </div>
  </div>
  <footer>© 2026 PumpToUnlock. All rights reserved.</footer>
</main>
</body>
</html>
